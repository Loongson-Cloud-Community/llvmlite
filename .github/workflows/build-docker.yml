name: Build and Push manylinux llvm build image

on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        default: 'dev'
      push:
        required: false
        default: 'true'
      llvm_version:
        required: true
        default: '20.1.8'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/loong64
          push: ${{ github.event.inputs.push }}
          build-args: |
            base=lcr.loongnix.cn/pypa/manylinux_2_38_loongarch64
            llvm_version=${{ github.event.inputs.llvm_version }}
          tags: |
            ghcr.io/loongson-cloud-community/manylinux_2_38_llvm:latest
            ghcr.io/loongson-cloud-community/manylinux_2_38_llvm:${{ github.event.inputs.llvm_version }}
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
